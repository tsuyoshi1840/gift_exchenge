# ==================================
# リリース用ビルド（GitHub Actions）
# ==================================
# タグ（例: v1.26.11.3）を push すると、GitHub 上の Windows 環境で
#   1. build.py（バージョン情報の生成）
#   2. PyInstaller（EXE 作成）
#   3. Inno Setup（インストーラー作成）
# を実行し、GitHub Releases に GiftExchange_Setup.exe を添付する。
#
# SignPath の署名は、リポジトリの Variables に SIGNPATH_ENABLED=true を
# 設定するまで実行されない（審査が通ったら有効にする）。
# 必要な設定は CODE_SIGNING_POLICY.md と BUILD.md を参照。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:   # Actions 画面から手動実行（Release は作らず、成果物だけ確認できる）

permissions:
  contents: write      # Release の作成に必要
  actions: read

jobs:
  build:
    # SignPath Foundation の条件：署名する成果物は GitHub ホストのランナーでビルドすること
    runs-on: windows-latest

    env:
      SIGNING_ENABLED: ${{ vars.SIGNPATH_ENABLED == 'true' }}
      # Windows ランナーの標準文字コードは cp1252 なので、日本語の print で落ちないよう UTF-8 にする
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: バージョン情報を生成（build.py）
        run: python build.py

      - name: EXE を作成（PyInstaller）
        run: pyinstaller GiftExchange.spec --clean --noconfirm

      # ---------- 署名 1: アプリ本体（dist\GiftExchange の中の EXE） ----------

      - name: 未署名のアプリをアップロード
        id: upload-unsigned-app
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GiftExchange-app-unsigned
          path: dist/GiftExchange/

      - name: アプリに署名（SignPath）
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gift_exchenge
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/GiftExchange-signed

      - name: 署名済みのアプリに差し替え
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist/GiftExchange
          Move-Item dist/GiftExchange-signed dist/GiftExchange

      # ---------- インストーラー作成 ----------

      - name: Inno Setup をインストール
        run: choco install innosetup -y --no-progress

      - name: インストーラーを作成（Inno Setup）
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" GiftExchange.iss'

      # ---------- 署名 2: インストーラー ----------

      - name: 未署名のインストーラーをアップロード
        id: upload-unsigned-installer
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GiftExchange-installer-unsigned
          path: installer/GiftExchange_Setup.exe

      - name: インストーラーに署名（SignPath）
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: gift_exchenge
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: installer-signed

      - name: 署名済みのインストーラーに差し替え
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: Copy-Item installer-signed/GiftExchange_Setup.exe installer/GiftExchange_Setup.exe -Force

      # ---------- 配布 ----------

      - name: インストール不要版（ZIP）を作成
        shell: pwsh
        run: Compress-Archive -Path dist/GiftExchange -DestinationPath installer/GiftExchange_Portable.zip

      - name: 成果物を保存（Actions 画面からダウンロード可）
        uses: actions/upload-artifact@v4
        with:
          name: GiftExchange-release
          path: |
            installer/GiftExchange_Setup.exe
            installer/GiftExchange_Portable.zip

      - name: GitHub Release に添付
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/GiftExchange_Setup.exe
            installer/GiftExchange_Portable.zip
          generate_release_notes: true
